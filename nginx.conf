server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Customer share link: /order/<code> serves the standalone request page.
    location ~ "^/order(?:/([A-Za-z0-9]{0,64}))?/?$" {
        rewrite "^/order(?:/([A-Za-z0-9]{0,64}))?/?$" /customer.html?shop=$1 last;
    }

    # API → Kotlin gateway (same-origin, so the frontend needs no config).
    location /api/ {
        proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long cache for static assets, no cache for HTML.
    location ~* \.(?:js|css|png|jpg|jpeg|svg|webmanifest|json)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
